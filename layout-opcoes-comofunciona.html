<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yara Estrela — Opções para Como funciona</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--marfim:#FFFFFF;--linho:#F6F6F5;--nude:#DDDDDB;--taupe:#6F6F6F;--espresso:#111111;--champagne:#111111;
        --serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif}
  body.warm{--marfim:#F7F3EE;--linho:#EDE5DB;--nude:#D9C3B5;--taupe:#7A695E;--espresso:#2B2522;--champagne:#B89B72}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9e6e1;font:300 15px/1.6 var(--sans);color:#2B2522;padding:0 0 80px}
  .top{max-width:1100px;margin:0 auto;padding:36px 20px 10px}
  .top h1{font:400 2rem/1.1 var(--serif)}
  .top p{margin:8px 0 14px;color:#6b625b}
  .tog{display:inline-flex;border:1px solid #2B2522;border-radius:99px;overflow:hidden}
  .tog button{border:0;background:none;padding:8px 16px;font:400 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  .tog button.on{background:#2B2522;color:#fff}
  .opt{max-width:1100px;margin:44px auto 0;padding:0 20px}
  .opt h2{font:400 1.5rem var(--serif);margin-bottom:4px}
  .opt h2 b{display:inline-block;background:#2B2522;color:#fff;min-width:32px;height:32px;line-height:32px;text-align:center;border-radius:99px;padding:0 9px;font:400 14px/32px var(--sans);margin-right:10px}
  .opt h2 u{text-decoration:none;font:400 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#6b625b;border:1px solid #b9b0a7;border-radius:99px;padding:3px 9px;margin-left:10px;vertical-align:middle}
  .opt .why{color:#6b625b;margin:0 0 12px;font-size:14px}
  .mock{container-type:inline-size;width:100%;position:relative;overflow:hidden;background:var(--marfim);color:var(--espresso);box-shadow:0 10px 40px rgba(0,0,0,.18);padding:5cqw 6cqw}
  .mock *{font-family:var(--sans)}
  .lbl{font:400 .8cqw var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--taupe);display:block;margin-bottom:1cqw}
  .h2{font:300 3.3cqw/1.1 var(--serif)}
  .h2 em{font-style:italic}
  .ctr{text-align:center}
  .nm{font:300 2.6cqw/1 var(--serif);color:var(--taupe)}
  .h3{font:400 1.7cqw/1.2 var(--serif);margin:.6cqw 0 .5cqw}
  .p{font-size:1.05cqw;line-height:1.7;color:#5b514b}
  .btn{display:inline-block;background:var(--espresso);color:var(--marfim);font:400 .85cqw var(--sans);letter-spacing:.22em;text-transform:uppercase;padding:1.2cqw 2.4cqw;margin-top:3.4cqw}
  .g5{display:grid;grid-template-columns:repeat(5,1fr);gap:2.4cqw}
  .hd{margin-bottom:3.4cqw}
  /* 1 atual */
  .o1 .s{text-align:center}
  /* 2 horizontal */
  .o2 .tl{position:relative}
  .o2 .tl::before{content:"";position:absolute;left:0;right:0;top:.6cqw;height:1px;background:var(--champagne)}
  .o2 .s{position:relative;padding-top:2.6cqw}
  .o2 .s::before{content:"";position:absolute;left:0;top:0;width:1.2cqw;height:1.2cqw;border-radius:50%;background:var(--marfim);border:1px solid var(--champagne)}
  .o2 .s .nm{font-size:1.4cqw;font-style:italic;margin-bottom:.4cqw}
  /* 3 vertical alternada */
  .o3 .v{position:relative;max-width:64cqw;margin:0 auto}
  .o3 .v::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--champagne)}
  .o3 .s{position:relative;width:50%;padding:0 4cqw 3.4cqw 0;text-align:right}
  .o3 .s:nth-child(even){margin-left:50%;padding:0 0 3.4cqw 4cqw;text-align:left}
  .o3 .s::after{content:"";position:absolute;top:.7cqw;right:-.6cqw;width:1.2cqw;height:1.2cqw;border-radius:50%;background:var(--marfim);border:1px solid var(--champagne)}
  .o3 .s:nth-child(even)::after{right:auto;left:-.6cqw}
  .o3 .s .nm{font-size:1.4cqw;font-style:italic}
  /* 4 lista */
  .o4 .r{display:grid;grid-template-columns:10cqw 26cqw 1fr;gap:2cqw;align-items:baseline;border-top:1px solid var(--nude);padding:2cqw 0}
  .o4 .r:last-child{border-bottom:1px solid var(--nude)}
  .o4 .r .nm{font:italic 300 4.4cqw/.9 var(--serif)}
  .o4 .r .h3{margin:0;font-size:2cqw}
  /* 5 fluxo */
  .o5 .s{border:1px solid var(--nude);padding:2cqw 1.6cqw;position:relative;text-align:center;background:var(--marfim)}
  .o5 .s .ci{width:3.6cqw;height:3.6cqw;border-radius:50%;border:1px solid var(--champagne);display:flex;align-items:center;justify-content:center;margin:0 auto 1.2cqw;font:italic 300 1.6cqw var(--serif);color:var(--taupe)}
  .o5 .s:not(:last-child)::after{content:"→";position:absolute;right:-2.1cqw;top:50%;transform:translateY(-50%);font-size:1.6cqw;color:var(--champagne);z-index:2}
  .o5 .g5{gap:2.6cqw}
  /* 6 e 7 stepper */
  .stp{position:relative;display:flex;justify-content:space-between;max-width:64cqw;margin:0 auto 3.6cqw}
  .stp::before{content:"";position:absolute;left:2cqw;right:2cqw;top:2cqw;height:1px;background:var(--nude)}
  .stp .fill{position:absolute;left:2cqw;top:2cqw;height:1px;background:var(--espresso);width:0;transition:width .6s}
  .stp button{position:relative;z-index:2;width:4cqw;height:4cqw;border-radius:50%;border:1px solid var(--nude);background:var(--marfim);color:var(--taupe);font:italic 300 1.6cqw var(--serif);cursor:pointer;transition:.3s}
  .stp button.on{background:var(--espresso);color:var(--marfim);border-color:var(--espresso)}
  .stp button.dn{border-color:var(--espresso);color:var(--espresso)}
  .stp .lb{position:absolute;top:5cqw;left:50%;transform:translateX(-50%);white-space:nowrap;font:400 .75cqw var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--taupe)}
  .det{min-height:14cqw;text-align:center;max-width:46cqw;margin:0 auto}
  .det .h3{font-size:3cqw}
  .det .p{font-size:1.25cqw}
  /* 8 curva */
  .o8 .cv{position:relative;height:36cqw;margin-top:1cqw}
  .o8 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .o8 .pt{position:absolute;width:1.3cqw;height:1.3cqw;border-radius:50%;background:var(--marfim);border:1px solid var(--champagne);transform:translate(-50%,-50%)}
  .o8 .tx{position:absolute;width:16cqw;transform:translateX(-50%);text-align:center}
  .o8 .tx .nm{font-size:1.4cqw;font-style:italic}
  .pick{max-width:1100px;margin:54px auto 0;padding:0 20px;color:#6b625b}
</style>
</head>
<body>
<div class="top">
  <h1>Como funciona · 8 opções</h1>
  <p>Os cinco passos, com os textos novos e sem fotos. Duas são interativas e uma se mexe sozinha. Me diga o número (ou misture).</p>
  <div class="tog" role="group" aria-label="Paleta">
    <button class="on" data-p="bw">Preto e branco (atual)</button>
    <button data-p="warm">Paleta quente</button>
  </div>
</div>
<div id="root"></div>
<p class="pick">Em todas o botão "Consultar disponibilidade" abre o WhatsApp.</p>

<script>
const ST=[['01','Consulta da data','Você me conta sobre o casamento pelo WhatsApp.'],['02','Reserva','A data fica reservada com o contrato.'],['03','Teste e orientação','Escolhemos juntas a maquiagem e o penteado, combinando com o vestido.'],['04','O dia','Te arrumo com calma, sem correria.'],['05','Depois do sim','Fico com você até a festa começar.']];
const hd=(c='')=>`<div class="hd ${c}"><span class="lbl">Como funciona</span><div class="h2">Do primeiro contato <em>até a festa</em></div></div>`;
const cta=`<span class="btn">Consultar disponibilidade</span>`;
const step=(i)=>`<span class="nm">${ST[i][0]}</span><div class="h3">${ST[i][1]}</div><p class="p">${ST[i][2]}</p>`;
const O=[];const add=(t,mv,w,h)=>O.push([t,mv,w,h]);

add('Atual (referência)','estática','Cinco colunas centralizadas, com número grande cinza. É como está no site hoje (com o texto novo).',
 `<div class="mock o1 ctr">${hd()}<div class="g5">${ST.map((_,i)=>`<div class="s">${step(i)}</div>`).join('')}</div>${cta}</div>`);
add('Linha do tempo horizontal','estática','Uma linha fina com cinco pontos e um passo embaixo de cada um. Mostra um caminho, da consulta até a festa.',
 `<div class="mock o2">${hd()}<div class="tl"><div class="g5">${ST.map((_,i)=>`<div class="s">${step(i)}</div>`).join('')}</div></div>${cta}</div>`);
add('Linha do tempo vertical','estática','Uma linha no meio e os passos alternando esquerda e direita. Ocupa mais altura, mas fica bem legível no celular.',
 `<div class="mock o3 ctr">${hd()}<div class="v">${ST.map((_,i)=>`<div class="s">${step(i)}</div>`).join('')}</div>${cta}</div>`);
add('Lista com números grandes','estática','Cada passo numa linha larga: número gigante em itálico, título e texto. Parece um índice de revista.',
 `<div class="mock o4">${hd()}<div>${ST.map((_,i)=>`<div class="r"><span class="nm">${ST[i][0]}</span><div class="h3">${ST[i][1]}</div><p class="p">${ST[i][2]}</p></div>`).join('')}</div>${cta}</div>`);
add('Cartões com setas','estática','Cinco cartões de linha fina ligados por setas, como um fluxo. Deixa claro que é uma sequência.',
 `<div class="mock o5 ctr">${hd()}<div class="g5">${ST.map((_,i)=>`<div class="s"><div class="ci">${ST[i][0]}</div><div class="h3">${ST[i][1]}</div><p class="p">${ST[i][2]}</p></div>`).join('')}</div>${cta}</div>`);
add('Passos clicáveis','interativa','Cinco bolinhas numeradas ligadas por uma linha; ao clicar numa, o passo aparece embaixo em tamanho grande. Mostra um de cada vez, com pouca poluição.',
 `<div class="mock ctr" id="m6">${hd()}<div class="stp" id="st6"></div><div class="det" id="d6"></div>${cta}</div>`);
add('Passos que avançam sozinhos','movimento','A mesma ideia, mas os passos avançam sozinhos a cada 3 segundos e a linha vai se preenchendo. Dá para clicar para escolher.',
 `<div class="mock ctr" id="m7">${hd()}<div class="stp" id="st7"></div><div class="det" id="d7"></div>${cta}</div>`);
add('Caminho ondulado','estática','Uma linha que faz ondas e passa pelos cinco pontos, com o texto alternando em cima e embaixo. Mais solta e delicada.',
 `<div class="mock o8 ctr">${hd()}<div class="cv" id="cv"></div>${cta}</div>`);

const root=document.getElementById('root');
O.forEach(([t,mv,w,h],i)=>root.insertAdjacentHTML('beforeend',`<section class="opt"><h2><b>${i+1}</b>${t}<u>${mv}</u></h2><p class="why">${w}</p>${h}</section>`));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function stepper(sid,did,auto){
  const st=document.getElementById(sid),d=document.getElementById(did);
  st.innerHTML='<i class="fill"></i>'+ST.map((s,i)=>`<button data-i="${i}" aria-label="${s[1]}">${i+1}</button>`).join('');
  const bs=[...st.querySelectorAll('button')],fill=st.querySelector('.fill');let k=0,t;
  const show=i=>{k=i;bs.forEach((b,j)=>{b.className=j===i?'on':(j<i?'dn':'')});
    fill.style.width=(i/(ST.length-1))*(st.clientWidth-st.clientWidth*.0-0)*0.0+'px';
    const w=st.clientWidth;const cw=bs[0].offsetWidth;fill.style.width=(i/(ST.length-1))*(w-cw)+'px';
    d.innerHTML=`<div class="h3">${ST[i][1]}</div><p class="p">${ST[i][2]}</p>`};
  show(0);
  st.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;show(+b.dataset.i);if(auto){clearInterval(t);t=setInterval(()=>show((k+1)%ST.length),3000)}});
  if(auto&&!reduce)t=setInterval(()=>show((k+1)%ST.length),3000);
}
stepper('st6','d6',false);stepper('st7','d7',true);
// curva: pontos nos topos e vales da onda, texto do lado de fora
(function(){const cv=document.getElementById('cv');const f=x=>15-6*Math.cos(Math.PI*(x-10)/20);
 let d='';for(let x=0;x<=100;x+=1)d+=(x?'L':'M')+x+','+f(x).toFixed(2);
 cv.innerHTML='<svg viewBox="0 0 100 30" preserveAspectRatio="none"><path d="'+d+'" fill="none" stroke="var(--champagne)" vector-effect="non-scaling-stroke" style="stroke-width:1px"/></svg>';
 [10,30,50,70,90].forEach((x,i)=>{const y=f(x),top=y/30*100,up=y<15;
  cv.insertAdjacentHTML('beforeend','<span class="pt" style="left:'+x+'%;top:'+top+'%"></span><div class="tx" style="left:'+x+'%;top:calc('+top+'% '+(up?'- 1.8cqw':'+ 1.8cqw')+');'+(up?'transform:translate(-50%,-100%)':'')+'">'+step(i)+'</div>')})})();
document.querySelectorAll('.tog button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tog button').forEach(x=>x.classList.toggle('on',x===b));
  document.body.classList.toggle('warm',b.dataset.p==='warm');
});
</script>
</body>
</html>
